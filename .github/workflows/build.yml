name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the version is computed from git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          GRIM_GIT_ORG: ${{ github.repository_owner }}
          GRIM_GIT_REPO: ${{ github.event.repository.name }}
          GRIM_MAIN_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./gradlew build --no-daemon

      - name: Upload Bukkit jar
        uses: actions/upload-artifact@v4
        with:
          name: grimac-bukkit
          path: bukkit/build/libs/grimac-bukkit-*.jar
          if-no-files-found: error

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: grimac-fabric
          path: fabric/build/libs/grimac-fabric-*.jar
          if-no-files-found: error
